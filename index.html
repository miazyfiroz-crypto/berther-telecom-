<title>ব্রাদার্স টেলিকম – প্ল্যাটফর্ম ডেমো</title>
<style>
body{margin:0;font-family:"Noto Sans Bengali","Kalpurush",system-ui,sans-serif;min-height:100vh;background:var(--bg);color:var(--text);transition:background .3s,color .3s}
body.classic{--bg:#FAFAFA;--card:#FFFFFF;--text:#111111;--ink:#000000;--accent:#C62828;--on:#FFFFFF;--head:#B71C1C;--headt:#FFFFFF;--hero:#C62828;--herot:#FFFFFF;--line:#F2D7D7;--muted:#444444;--pill:#FDEFEF;--input:#FFFFFF;--side:#B71C1C;--th:#FDF0F0;--shadow:0 2px 10px rgba(183,28,28,.08)}
body.gold{--bg:#0B0F14;--card:#131A24;--text:#E9D9A6;--ink:#F3D77A;--accent:linear-gradient(135deg,#E6C14A,#B8912A);--on:#1A1408;--head:linear-gradient(135deg,#1B2230,#0B0F14);--headt:#F3D77A;--hero:linear-gradient(135deg,#E6C14A,#8C6D1F);--herot:#1A1408;--line:#2A2415;--muted:#9C8F6A;--pill:#2A2414;--input:#0F141B;--side:#07090D;--th:#1B2230;--shadow:0 2px 14px rgba(0,0,0,.4)}
*{box-sizing:border-box}
button{font-family:inherit}
#app{max-width:440px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
body.admin #app{max-width:none}
.modebar{display:flex;gap:6px;padding:8px;background:var(--card);border-bottom:1px solid var(--line);justify-content:center;position:sticky;top:0;z-index:20}
.modebar button{flex:1;max-width:200px;padding:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:99px;cursor:pointer;font-size:13px}
.modebar button.on{background:var(--accent);color:var(--on);border-color:transparent;font-weight:700}
header{background:var(--head);color:var(--headt);padding:16px 18px 22px;border-radius:0 0 26px 26px;box-shadow:0 6px 18px rgba(0,0,0,.15)}
header h1{margin:0;font-size:19px}
header p{margin:2px 0 0;font-size:12px;opacity:.85}
main{flex:1;padding:16px 14px 96px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.hero{background:var(--hero);color:var(--herot);border:none}
.hero small{opacity:.9}
.hero b{display:block;font-size:26px;margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat small{font-size:12px;color:var(--muted)}
.stat b{display:block;font-size:19px;margin-top:4px}
.icons{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:16px}
.icons button{background:none;border:none;color:var(--text);font-size:12px;font-weight:600;padding:4px 0;cursor:pointer}
.icons i{display:flex;align-items:center;justify-content:center;width:54px;height:54px;margin:0 auto 6px;border-radius:50%;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);font-size:22px;font-style:normal}
h2{font-size:15px;margin:6px 2px 10px;color:var(--ink)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.t{font-size:14px;font-weight:600}
.s{font-size:12px;color:var(--muted);margin-top:2px}
.amt{font-weight:700;white-space:nowrap}
.btn{background:var(--accent);color:var(--on);border:none;border-radius:12px;padding:12px 14px;font-size:15px;font-weight:700;width:100%;cursor:pointer}
.btn.sm{width:auto;padding:6px 10px;font-size:12px;border-radius:8px}
.btn.g{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.ok{background:#2E7D32;color:#fff}
.btn:disabled{opacity:.4}
.btns{display:flex;gap:8px;margin-bottom:12px}
.btns .btn{flex:1}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:var(--input);color:var(--text);font-family:inherit}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 5px}
.types{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.types button{padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--input);color:var(--text);cursor:pointer}
.types button.on{background:var(--accent);color:var(--on);border-color:transparent}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.modal.c{align-items:center;padding:16px}
.sheet{background:var(--card);color:var(--text);width:100%;max-width:440px;border-radius:18px 18px 0 0;padding:18px 16px 24px;max-height:90vh;overflow-y:auto}
.modal.c .sheet{border-radius:16px}
.sheet h3{margin:0 0 4px;color:var(--ink)}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;display:flex;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -4px 14px rgba(0,0,0,.08);z-index:10}
nav button{flex:1;background:none;border:none;padding:9px 2px;font-size:11px;color:var(--muted);cursor:pointer}
nav button.on{color:var(--text);font-weight:700}
nav span{display:inline-block;font-size:17px;padding:3px 12px;border-radius:99px}
nav button.on span{background:var(--pill)}
.lock{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;min-height:100vh}
.dots{display:flex;gap:12px;margin:18px 0 26px}

.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px}

.p-wait{background:#FFF3E0;color:#B65B00}
.p-ok{background:#E8F5E9;color:#2E7D32}
.p-no{background:#FDECEC;color:#8E0000}
.toggle{width:46px;height:26px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;flex-shrink:0}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.toggle.on{background:var(--accent)}
.toggle.on::after{left:23px}
.muted{color:var(--muted);font-size:12px}
.empty{text-align:center;color:var(--muted);padding:22px 0}
.note{font-size:12px;color:var(--muted);text-align:center;margin-top:14px;line-height:1.6}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px}
.bar div{height:100%;background:var(--accent)}
.shell{display:flex;min-height:100vh}
aside{width:220px;background:var(--side);padding:18px 12px;flex-shrink:0}
aside .brand{color:var(--headt);font-weight:700;font-size:16px;padding:4px 8px 16px}

aside button.on{background:#fff;color:#8E0000;font-weight:700}
body.gold aside button{color:var(--text)}
body.gold aside button.on{background:var(--accent);color:var(--on)}
.badge{margin-left:auto;background:#fff;color:#8E0000;font-size:11px;font-weight:700;border-radius:99px;padding:1px 7px}
.main{flex:1;padding:22px;min-width:0;background:var(--bg)}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 18px;margin-bottom:16px;box-shadow:var(--shadow)}
.top h2{margin:0;font-size:20px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.wrap{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow-x:auto;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{background:var(--th);color:var(--muted);font-weight:600}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--text);padding:6px 12px;border-radius:99px;font-size:13px;cursor:pointer}
.tabs button.on{background:var(--accent);color:var(--on);border-color:transparent}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--hero)}
.login .box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px;width:100%;max-width:360px;color:var(--text);box-shadow:0 10px 30px rgba(0,0,0,.25)}
@media (max-width:760px){
  .shell{flex-direction:column}
  aside{width:100%;display:flex;overflow-x:auto;gap:4px;align-items:center;padding:10px}
  aside .brand{white-space:nowrap;padding:0 8px}
  aside button{width:auto;white-space:nowrap;margin:0}
  .grid2{grid-template-columns:1fr}
  .wrap{overflow:visible;background:none;border:none;box-shadow:none}
  table,thead,tbody,tr,td{display:block;width:100%}
  thead{display:none}
  tr{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:10px;box-shadow:var(--shadow)}
  td{border:none;padding:5px 0;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:right}
  td::before{content:attr(data-label);color:var(--muted);font-size:12px;text-align:left}
}
body.rose{--bg:#FFF5F6;--card:#FFFFFF;--text:#111111;--ink:#000000;--accent:#D92B33;--on:#FFFFFF;--head:#FCE4E7;--headt:#8E1B16;--hero:#D92B33;--herot:#FFFFFF;--line:#F6DADD;--muted:#444444;--pill:#FDECEE;--input:#FFFFFF;--side:#D92B33;--th:#FDF0F1;--shadow:0 1px 8px rgba(217,43,51,.08)}
body.rose header{box-shadow:none;border-radius:0 0 22px 22px}
body.rose .card{border-radius:14px}
body.rose .hero{background:linear-gradient(135deg,#FFFFFF,#FDE7EA);color:#000000;border:1px solid #F6DADD}

body.rose nav button.on{color:#D92B33}

.mini4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.mini4 .card{background:#FFFFFF;color:#000000;padding:8px 4px;margin:0;text-align:center}
.mini4 small{display:block;font-size:10px;color:#000000}
.mini4 b{display:block;font-size:12px;color:#000000;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.op{background:#FFFFFF;border:2px solid #DDDDDD;border-radius:12px;padding:12px 4px;cursor:pointer;color:#000000;font-size:13px}
.op.on{background:#FFF7E6}
.chips{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:4px}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:99px;padding:6px 12px;font-size:12px;cursor:pointer}
.chip.on{background:var(--accent);color:var(--on);border-color:transparent}
.ocard{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;background:var(--card)}
.avatar{width:42px;height:42px;border-radius:50%;background:#EDE4FA;color:#4A2C8A;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;flex-shrink:0}

<body class="classic">

<script>
const LOGO="icons/icon-192.png";
const BN="০১২৩৪৫৬৭৮৯";
const bn=n=>{const s=Math.round(n).toLocaleString("en-US");return S.bnDigits?s.replace(/\d/g,d=>BN[d]):s};
const taka=n=>"৳ "+bn(n);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function today(o){const d=new Date();d.setDate(d.getDate()+o);return d.toISOString().slice(0,10)}
function dateLabel(iso){if(iso===today(0))return "আজ";if(iso===today(-1))return "গতকাল";return iso.split("-").reverse().join("/")}
const nid=()=>"T"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const TXT={drive:"ড্রাইভ",sale:"বিক্রি",expense:"খরচ",due:"বাকি বিক্রি",collect:"বাকি আদায়",send:"ট্রান্সফার",recharge:"মোবাইল রিচার্জ",bill:"বিল পেমেন্ট",add:"অ্যাড মানি",withdraw:"উইথড্র"};
const ST={pending:["অপেক্ষমাণ","p-wait"],approved:["অনুমোদিত","p-ok"],rejected:["বাতিল","p-no"],done:["সম্পন্ন","p-ok"]};
const USERS={firoz:{pass:"6920",role:"super",name:"firoz"},admin:{pass:"1234",role:"super",name:"সুপার এডমিন"},viewer:{pass:"1234",role:"viewer",name:"দেখার অনুমতি"}};
const TITLES={profile:"আমার প্রোফাইল",sales:"বিক্রি ও খরচ",dues:"বাকি হিসাব",wallet:"মোবাইল ওয়ালেট",report:"রিপোর্ট",settings:"সেটিংস"};
const APAGES=[["dash","📊","ড্যাশবোর্ড"],["req","👛","ওয়ালেট রিকুয়েস্ট"],["users","👥","সকল ইউজার"],["notice","📢","নোটিশ"],["settings","⚙️","সেটিংস ও কন্ট্রোল"],["tx","🧾","সব লেনদেন"],["rep","📥","রিপোর্ট"],["audit","📜","অডিট লগ"]];

const S={
  mode:"app", theme:"classic",
  pin:"", pinOk:false, pinErr:"", tab:"home", shop:"ব্রাদার্স টেলিকম", bnDigits:true,
  hisab:[
    {id:"h1",type:"sale",amount:2500,note:"মোবাইল রিচার্জ ও সিম",cust:"",date:today(0)},
    {id:"h2",type:"expense",amount:300,note:"বিদ্যুৎ বিল",cust:"",date:today(0)},
    {id:"h3",type:"due",amount:1200,note:"চাল ও তেল",cust:"রহিম মিয়া",date:today(-1)},
    {id:"h4",type:"collect",amount:500,note:"আংশিক পরিশোধ",cust:"রহিম মিয়া",date:today(-3)}
  ],
  customers:["রহিম মিয়া","করিম ভাই"],
  modal:null, form:{}, wmodal:null, wform:{},
  balance:0, tx:[], dbNote:"", busy:{}, me:"", users:[], nDraft:"", limitDraft:null,
  settings:{features:{wallet:true,transfer:true,recharge:true,bill:true},limits:{daily:50000,perTx:10000},maintenance:false,shopName:"",notice:{text:"",at:""}},
  auth:{user:"",pass:"",err:"",ok:false,role:"",name:""},
  apage:"dash", afilter:"all", asearch:"", amodal:null, mdata:{},
  shops:[
    {id:1,name:"রহিম টেলিকম",phone:"017XXXXXXXX",status:"active"},
    {id:2,name:"করিম মোবাইল শপ",phone:"018XXXXXXXX",status:"active"},
    {id:3,name:"সাকিব সিম কর্নার",phone:"019XXXXXXXX",status:"blocked"}
  ],
  features:{wallet:true,cashback:true,register:true,recharge:true,bill:true,transfer:true},
  audit:[{t:"আজ 09:30",who:"admin",act:"সিস্টেম চালু"}]
};

/* ---------- shared database (wallet + requests) ---------- */
let DB=null;
function log(act){S.audit.unshift({t:"এইমাত্র",who:S.auth.user||"admin",act})}
let AUTH=null, SUBS=[];
function pinPassword(p){return "bt-"+p+"-brothers"}
function stopSubs(){
  SUBS.forEach(u=>{ try{ u() }catch(e){} });
  SUBS=[]; S.users=[]; S.tx=[]; S.wallets={}; S.balance=0; S.myProfile=null; S.isAdmin=false;
}
async function isAdminEmail(email){
  try{ const d=await DB.doc("admins/"+email).get(); return d.exists; }catch(e){ return false }
}
async function startSubs(u){
  stopSubs();
  const uid=u.uid; S.me=uid;
  const admin=await isAdminEmail(u.email||"");
  if(S.me!==uid) return;
  S.isAdmin=admin;
  const fail=()=>{ S.dbNote="ডেটা সংযোগে সমস্যা"; render(); };
  SUBS.push(DB.doc("settings/main").onSnapshot(s=>{ if(s.exists) S.settings=Object.assign({},DEF_SETTINGS,s.data()); render(); },()=>{}));
  SUBS.push((admin?DB.collection("hisab"):DB.collection("hisab").where("uid","==",uid)).onSnapshot(q=>{ S.hisab=q.docs.map(d=>Object.assign({id:d.id},d.data())); S.customers=allCust().map(c=>c.name); render(); },()=>{}));
  SUBS.push((admin?DB.collection("customers"):DB.collection("customers").where("uid","==",uid)).onSnapshot(q=>{ S.custObjs=q.docs.map(d=>Object.assign({id:d.id},d.data())); S.customers=allCust().map(c=>c.name); render(); },()=>{}));
  SUBS.push(DB.doc("wallets/"+uid).onSnapshot(s=>{ if(!admin){ S.balance=s.exists?(s.data().balance||0):0; S.dbNote=""; render(); } },fail));
  SUBS.push(DB.doc("users/"+uid).onSnapshot(s=>{ S.myProfile=s.exists?s.data():null; render(); },()=>{}));
  if(admin){
    SUBS.push(DB.collection("wallets").onSnapshot(q=>{ S.wallets={}; q.docs.forEach(d=>{ S.wallets[d.id]=(d.data().balance||0); }); S.balance=S.wallets[uid]||0; render(); },fail));
    SUBS.push(DB.collection("users").onSnapshot(q=>{ S.users=q.docs.map(d=>Object.assign({id:d.id},d.data())); render(); },()=>{}));
    SUBS.push(DB.collection("wallet_tx").onSnapshot(q=>{ S.tx=q.docs.map(d=>Object.assign({id:d.id},d.data())); render(); },fail));
  } else {
    SUBS.push(DB.collection("wallet_tx").where("uid","==",uid).onSnapshot(q=>{ S.tx=q.docs.map(d=>Object.assign({id:d.id},d.data())); render(); },fail));
  }
}
async function boot(){
  try{ if(window.claude) DB=await window.claude.use("db"); }catch(e){ DB=null; }
  if(!DB){ S.dbNote="শেয়ার্ড ডেটাবেস এখন চালু নেই।"; render(); return; }
  AUTH=firebase.auth();
  AUTH.onAuthStateChanged(u=>{
    if(u){ S.pinOk=true; startSubs(u); }
    else { S.me=""; S.pinOk=false; stopSubs(); }
    render();
  });
  render();
}
function allPayInfo(){
  const pm=S.settings.payment||{};
  const rows=[["bkash","বিকাশ"],["nagad","নগদ"],["rocket","রকেট"],["bank","ব্যাংক অ্যাকাউন্ট"]].map(([k,l])=>{

function fileToDataUrl(file,maxSide,quality){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{
      const scale=Math.min(1,maxSide/Math.max(img.width,img.height));
      const c=document.createElement("canvas");
      c.width=Math.max(1,Math.round(img.width*scale));
      c.height=Math.max(1,Math.round(img.height*scale));
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL("image/jpeg",quality));
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error("image")); };
    img.src=url;
  });
}

  if(!AUTH) return setErr("ডেটাবেস চালু নেই");
  if(!d.name||!d.name.trim())return setErr("নাম লিখুন");
  if(!validPhone(d.phone||""))return setErr("সঠিক মোবাইল নম্বর দিন (01XXXXXXXXX)");
  if(!validPin(d.pin||""))return setErr("PIN ৪ সংখ্যার হতে হবে");
  if(d.pin!==d.pin2)return setErr("PIN দুটি মিলছে না");
  try{
    const cred=await AUTH.createUserWithEmailAndPassword(d.phone+"@brothers.app", pinPassword(d.pin));
    const uid=cred.user.uid, now=new Date().toISOString();
    await DB.doc("users/"+uid).set({name:d.name.trim(),phone:d.phone,blocked:false,lastSeen:now,createdAt:now});
    enter(uid,d.name.trim());
  }catch(e){
    setErr(e.code==="auth/email-already-in-use"?"এই নম্বরে আগেই রেজিস্ট্রেশন করা হয়েছে":"রেজিস্ট্রেশন হয়নি, আবার চেষ্টা করুন");
  }
}
async function doLogin(){
  const d=S.authDraft||{};
  if(!AUTH) return setErr("ডেটাবেস চালু নেই");
  if(!validPhone(d.phone||""))return setErr("সঠিক মোবাইল নম্বর দিন");
  if(!validPin(d.pin||""))return setErr("PIN ৪ সংখ্যার হতে হবে");
  try{
    const cred=await AUTH.signInWithEmailAndPassword(d.phone+"@brothers.app", pinPassword(d.pin));
    const uid=cred.user.uid;
    const ex=await DB.doc("users/"+uid).get();
    const u=ex.exists?ex.data():{name:"ব্যবহারকারী",blocked:false};
    if(u.blocked){ await AUTH.signOut(); return setErr("এই অ্যাকাউন্ট বন্ধ আছে"); }
    await DB.doc("users/"+uid).update({lastSeen:new Date().toISOString()}).catch(()=>{});
    enter(uid,u.name);
  }catch(e){
    setErr(["auth/wrong-password","auth/user-not-found","auth/invalid-credential"].includes(e.code)
      ?"নম্বর বা PIN ভুল, অথবা রেজিস্ট্রেশন নেই"
      :"লগইন হয়নি, আবার চেষ্টা করুন");
  }
}

async function decide(id,ok,note){
  if(S.auth.role!=="super"){ alert("এই কাজের অনুমতি নেই"); return }
  if(!needDb()||S.busy[id]) return;
  const t=S.tx.find(x=>x.id===id);
  if(!t||t.status!=="pending") return;
  S.busy[id]=1;
  try{
    if(!ok&&t.type==="drive") await DB.doc("wallets/"+t.uid).set({balance:bal(t.uid)+t.amount});
    else if(ok&&t.type==="add") await DB.doc("wallets/"+t.uid).set({balance:bal(t.uid)+t.amount});
    else if(ok&&(t.type==="withdraw"||t.type==="recharge")){
      if(bal(t.uid)<t.amount){ alert("ওয়ালেটে ব্যালেন্স যথেষ্ট নয়"); return }
      await DB.doc("wallets/"+t.uid).set({balance:bal(t.uid)-t.amount});
    }
    await DB.doc("wallet_tx/"+id).update({status:ok?"approved":"rejected",note:note||t.note});
    log((ok?"অনুমোদিত ":"বাতিল ")+id+" · "+TXT[t.type]+" "+taka(t.amount));
  }catch(e){ alert("কাজটি সম্পন্ন হয়নি") }
  finally{ delete S.busy[id]; S.amodal=null; render(); }
}

function hisabTotals(){
  const t=today(0); let sale=0,exp=0,due=0,cash=0;
  S.hisab.forEach(x=>{
    if(x.date===t){ if(x.type==="sale")sale+=x.amount; if(x.type==="expense")exp+=x.amount; }
    if(x.type==="sale"||x.type==="collect")cash+=x.amount;
    if(x.type==="expense")cash-=x.amount;
    if(x.type==="due")due+=x.amount;
    if(x.type==="collect")due-=x.amount;
  });
  return {sale,exp,profit:sale-exp,cash,due};
}
function dueList(){
  const m={};
  S.hisab.forEach(x=>{ if(!x.cust)return; if(x.type==="due")m[x.cust]=(m[x.cust]||0)+x.amount; if(x.type==="collect")m[x.cust]=(m[x.cust]||0)-x.amount; });
  return Object.entries(m).filter(e=>e[1]>0);
}

async function saveW(){
  const k=S.wmodal,f=S.wform,a=parseFloat(f.amount);
  if(!a||a<=0)return alert("সঠিক পরিমাণ লিখুন");
  let ok;
  if(k==="send"||k==="recharge"||k==="bill"){
    if(!f.to)return alert("নম্বর লিখুন");
    const note=k==="recharge"?"রিচার্জ · "+(f.op||"গ্রামীণফোন"):k==="bill"?"বিল · "+(f.op||"বিদ্যুৎ"):"ট্রান্সফার";
    ok=k==="recharge"?(openPin(()=>submitRecharge(a,note,f.to)),"pending"):await debit(k,a,note,f.to);
  } else {
    const note=(f.method||"বিকাশ")+(k==="withdraw"?" · উইথড্র":" · অ্যাড মানি");
    ok=await request(k,a,note,f.to);
    if(ok) alert("রিকুয়েস্ট পাঠানো হয়েছে। এডমিন অনুমোদন করলে ব্যালেন্সে যোগ হবে।");
  }
  if(!ok)return;
  S.wmodal=null; S.tab="wallet"; render();
}

async function aLogin(){

  if(!AUTH){ S.auth.err="ডেটাবেস চালু নেই"; return render(); }
  try{
    await AUTH.signInWithEmailAndPassword(email, pass);
    const ok=await isAdminEmail(email);
    if(!ok){ await AUTH.signOut(); S.auth.err="এই অ্যাকাউন্টে এডমিন অনুমতি নেই"; return render(); }
    S.auth={user:email,pass:"",err:"",ok:true,role:"super",name:email};
    log("লগইন করেছেন");
  }catch(e){ S.auth.err="ইমেইল বা পাসওয়ার্ড ভুল"; }
  render();
}

  return `<div class="wrap"><table><thead><tr><th>আইডি</th><th>ধরন</th><th>পরিমাণ</th><th>অবস্থা</th></tr></thead><tbody>
  ${sortedTx().map(x=>{const st=ST[x.status]||ST.done;return `<tr><td>${x.id}</td><td>${TXT[x.type]}</td><td>${taka(x.amount)}</td><td><span class="pill ${st[1]}">${st[0]}</span></td></tr>`}).join("")||`<tr><td colspan="4" class="muted" style="text-align:center;padding:24px">কোনো লেনদেন নেই</td></tr>`}
  </tbody></table></div><div class="muted" style="margin-top:8px">ওয়ালেট লেনদেন শেয়ার্ড ডেটাবেস থেকে আসে।</div>`;
}
function shopsPage(){
  const rows=S.shops.map(s=>`<tr><td><b>${esc(s.name)}</b></td><td>${s.phone}</td><td><span class="pill ${s.status==='active'?'p-ok':'p-no'}">${s.status==='active'?'সক্রিয়':'ব্লক'}</span></td><td><button class="btn sm ${s.status==='active'?'g':'ok'}" onclick="toggleShop(${s.id})">${s.status==='active'?'ব্লক করুন':'আনব্লক'}</button></td></tr>`).join("");
  return `<div class="wrap"><table><thead><tr><th>দোকান</th><th>ফোন</th><th>অবস্থা</th><th>কাজ</th></tr></thead><tbody>${rows}</tbody></table></div><div class="muted" style="margin-top:8px">দোকানের তালিকা এই ডেমোতে স্থানীয়ভাবে থাকে।</div>`;
}
function toggleShop(id){
  if(S.auth.role!=="super")return alert("এই কাজের অনুমতি নেই");
  const s=S.shops.find(x=>x.id===id);
  if(!confirm(s.name+(s.status==="active"?" ব্লক করবেন?":" আনব্লক করবেন?")))return;
  s.status=s.status==="active"?"blocked":"active";
  log(s.name+" "+(s.status==="blocked"?"ব্লক":"আনব্লক"));
  render();
}
function featPage(){
  const names={wallet:"ওয়ালেট",cashback:"ক্যাশব্যাক",register:"নতুন নিবন্ধন",recharge:"মোবাইল রিচার্জ",bill:"বিল পেমেন্ট",transfer:"ট্রান্সফার"};
  return `<div class="card">${Object.entries(names).map(([k,l])=>`<div class="row"><div><div class="t">${l}</div><div class="s">${S.features[k]?'চালু':'বন্ধ'}</div></div><div class="toggle ${S.features[k]?'on':''}" onclick="toggleFeat('${k}')"></div></div>`).join("")}</div><div class="muted">ফিচার চালু-বন্ধ ডেমোতে স্থানীয়ভাবে কাজ করে।</div>`;
}
function toggleFeat(k){
  if(S.auth.role!=="super")return alert("এই কাজের অনুমতি নেই");
  S.features[k]=!S.features[k];
  log("ফিচার "+k+(S.features[k]?" চালু":" বন্ধ"));
  render();
}
function repPage(){
  const rows=[["আইডি","ধরন","পরিমাণ","অবস্থা","তারিখ"]].concat(sortedTx().map(x=>[x.id,TXT[x.type],x.amount,(ST[x.status]||ST.done)[0],x.date]));
  const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\n");
  return `<div class="card"><div class="t" style="margin-bottom:6px">লেনদেন রিপোর্ট (CSV)</div><div class="muted" style="margin-bottom:8px">ডেমোতে ফাইল সরাসরি ডাউনলোড হয় না। নিচের টেক্সট কপি করে Excel-এ পেস্ট করুন।</div>
    <textarea id="csv" rows="10" readonly style="font-family:monospace;font-size:12px">${esc(csv)}</textarea>
    <div style="margin-top:10px"><button class="btn" style="width:auto" onclick="copyCsv()">কপি করুন</button></div></div>`;
}
function copyCsv(){const t=document.getElementById("csv");t.select();try{document.execCommand("copy");alert("কপি হয়েছে")}catch(e){alert("কপি করা যায়নি, নিজে সিলেক্ট করে কপি করুন")}}
function usersPage(){
  const rows=S.users.slice().sort((a,b)=>a.id<b.id?-1:1).map(u=>`<tr><td data-label="ইউজার"><b>${esc(u.name||"—")}</b><div class="muted">${esc(u.phone||u.id)}</div></td><td data-label="শেষ সক্রিয়">${u.lastSeen?new Date(u.lastSeen).toLocaleString("bn-BD"):"—"}</td><td data-label="অবস্থা"><span class="pill ${u.blocked?'p-no':'p-ok'}">${u.blocked?'ব্লক':'সক্রিয়'}</span></td><td data-label="কাজ"><button class="btn sm g" onclick="S.udetail='${esc(u.id)}';render()">বিস্তারিত</button> ${S.auth.role==="super"?`<button class="btn sm ${u.blocked?'ok':'g'}" onclick="toggleUser('${esc(u.id)}')">${u.blocked?'আনব্লক':'ব্লক করুন'}</button>`:""}</td></tr>`).join("");
  return `<div class="card muted">মোট ${bn(S.users.length)} জন ইউজার। ইউজার অ্যাপ খুললেই স্বয়ংক্রিয়ভাবে যোগ হয়।</div><div class="wrap"><table><thead><tr><th>ইউজার</th><th>শেষ সক্রিয়</th><th>অবস্থা</th><th>কাজ</th></tr></thead><tbody>${rows||'<tr><td colspan="4" class="muted" style="text-align:center;padding:24px">কোনো ইউজার নেই</td></tr>'}</tbody></table></div>`;
}
function noticePage(){
  const n=S.settings.notice||{};
  return `<div class="card"><div class="t" style="margin-bottom:6px">বর্তমান নোটিশ</div>${n.text?`<div style="margin-bottom:8px">${esc(n.text)}</div><div class="muted">প্রকাশ: ${esc(n.at)}</div>`:'<div class="muted">কোনো নোটিশ প্রকাশিত নেই।</div>'}</div>
    <div class="card"><label>ছবি (ঐচ্ছিক)</label><input type="file" accept="image/*" onchange="uploadNoticeImg(this)"><input placeholder="অথবা ছবির লিংক (https://...)" onchange="S.nImg=this.value.trim();render()" style="margin-top:6px">${S.nImg?`<img src="${esc(S.nImg)}" style="width:100%;border-radius:12px;margin-top:8px">`:""}</div>
    <div class="card"><label>নতুন নোটিশ (ইউজার অ্যাপের হোমে দেখাবে)</label><textarea rows="4" oninput="S.nDraft=this.value">${esc(S.nDraft||"")}</textarea>
    <div class="btns" style="margin-top:10px"><button class="btn" onclick="publishNotice()">প্রকাশ করুন</button><button class="btn g" onclick="clearNotice()">নোটিশ মুছুন</button></div></div>`;
}
function settingsPage(){
  const f=S.settings.features||{}, l=S.settings.limits||{};
  const names={wallet:"ওয়ালেট সেবা",transfer:"ট্রান্সফার",recharge:"মোবাইল রিচার্জ",bill:"বিল পেমেন্ট"};
  const can=S.auth.role==="super";
  const feats=Object.keys(names).map(k=>`<div class="row"><div><div class="t">${names[k]}</div><div class="s">${f[k]===false?'বন্ধ':'চালু'}</div></div><div class="toggle ${f[k]===false?'':'on'}" onclick="${can?`toggleFeature('${k}')`:'noPerm()'}"></div></div>`).join("");
  return `<div class="grid2">
    <div class="card"><div class="t" style="margin-bottom:4px">সেবা চালু/বন্ধ</div>${feats}</div>
    <div class="card"><div class="t" style="margin-bottom:4px">সীমা (লিমিট)</div>
      <label>দৈনিক সর্বোচ্চ (৳)</label><input type="number" value="${l.daily}" oninput="S.limitDraft={...(S.limitDraft||{}),daily:this.value}">
      <label>প্রতি লেনদেনের সর্বোচ্চ (৳)</label><input type="number" value="${l.perTx}" oninput="S.limitDraft={...(S.limitDraft||{}),perTx:this.value}">
      <button class="btn" style="margin-top:12px" onclick="${can?'saveLimits()':'noPerm()'}">সীমা সেভ করুন</button></div>
    <div class="card"><div class="row"><div><div class="t">রক্ষণাবেক্ষণ মোড</div><div class="s">চালু থাকলে ইউজার অ্যাপ বন্ধ দেখাবে</div></div><div class="toggle ${S.settings.maintenance?'on':''}" onclick="${can?'toggleMaintenance()':'noPerm()'}"></div></div></div>
    <div class="card"><div class="row"><div><div class="t">ড্যাশবোর্ডে দোকান হিসাব</div><div class="s">নগদ, বাকি ও বিক্রি এডমিন ড্যাশবোর্ডে দেখাবে</div></div><div class="toggle ${(S.settings.features||{}).dashHisab===false?'':'on'}" onclick="${S.auth.role==="super"?'toggleDashHisab()':'noPerm()'}"></div></div></div>
    ${dailyCard()}${adsCard()}${appUpdCard()}
    ${offersCard()}
    <div class="card"><div class="t" style="margin-bottom:6px">পেমেন্ট নম্বর ও QR (অ্যাড মানি)</div>${[["bkash","বিকাশ"],["nagad","নগদ"],["rocket","রকেট"],["bank","ব্যাংক অ্যাকাউন্ট"]].map(([k,l])=>{const p=(S.settings.payment||{})[k]||{};return `<label>${l} নম্বর</label><input value="${esc(p.no||"")}" onchange="savePay('${k}','no',this.value)">${k!=="bank"?`<label>${l} QR ছবি</label><input type="file" accept="image/*" onchange="uploadQr('${k}',this)"><input placeholder="অথবা QR-এর ছবির লিংক (https://...)" value="${esc(p.qr&&!String(p.qr).startsWith('data:')?p.qr:'')}" onchange="savePay('${k}','qr',this.value.trim())" style="margin-top:6px">${p.qr?'<div class="muted">QR যুক্ত আছে</div>':""}`:""}`}).join("")}</div>
    <div class="card"><label>অ্যাপের নাম (ইউজারদের হেডারে দেখাবে)</label><input value="${esc(S.settings.shopName||"")}" placeholder="ব্রাদার্স টেলিকম" onchange="saveSettings({shopName:this.value.trim()})"></div>
  </div>`;
}
function flatPatch(obj,prefix,out){
  Object.keys(obj).forEach(k=>{
    const v=obj[k], key=prefix?prefix+"."+k:k;
    if(v&&typeof v==="object"&&!Array.isArray(v)&&Object.keys(v).length) flatPatch(v,key,out);
    else out[key]=v;
  });
  return out;
}
async function saveSettings(patch){
  if(S.auth.role!=="super")return noPerm();
  if(!needDb())return;
  try{ await DB.doc("settings/main").update(flatPatch(patch,"",{})); log("সেটিংস আপডেট করা হয়েছে"); }
  catch(e){ alert("সেভ হয়নি, আবার চেষ্টা করুন"); }
}
function toggleFeature(k){const f=S.settings.features||{};saveSettings({features:{[k]:f[k]===false}})}
function toggleMaintenance(){saveSettings({maintenance:!S.settings.maintenance})}
function saveLimits(){const d=S.limitDraft||{};const l=S.settings.limits||{};saveSettings({limits:{daily:d.daily!==undefined?+d.daily:l.daily,perTx:d.perTx!==undefined?+d.perTx:l.perTx}});S.limitDraft=null}
function publishNotice(){const t=(S.nDraft||"").trim();if(!t)return alert("নোটিশ লিখুন");saveSettings({notice:{text:t,img:S.nImg||"",at:new Date().toLocaleString("bn-BD")}});S.nDraft="";S.nImg=""}
function clearNotice(){S.nDraft="";saveSettings({notice:{text:"",img:"",at:""}})}
function toggleUser(id){
  if(S.auth.role!=="super")return noPerm();
  if(!needDb())return;
  const u=S.users.find(x=>x.id===id); if(!u)return;
  DB.doc("users/"+id).update({blocked:!u.blocked}).then(()=>log((u.blocked?"আনব্লক ":"ব্লক ")+(u.name||id))).catch(()=>alert("কাজটি সম্পন্ন হয়নি"));
}
function auditPage(){return `<div class="card">${S.audit.map(a=>`<div class="row"><div><div class="t">${esc(a.act)}</div><div class="s">${esc(a.who)} · ${a.t}</div></div></div>`).join("")}</div>`}

/* ---------- render ---------- */
function render(){
  document.body.className=S.theme+(S.mode==="admin"?" admin":"");
  const bar="";
  document.getElementById("app").innerHTML = bar + (S.mode==="app"?appRoot():adminRoot()) + (S.toast?toastView():"") + (S.omodal?offersModal():"") + (S.pinModal?pinModalView():"") + (S.mode==="app"&&needUpdate()?updModal():"");
}
function setMode(m){S.mode=m;render();window.scrollTo(0,0)}

setInterval(()=>{const el=document.getElementById("clock");if(el)el.textContent=nowText()},1000);
render();
boot();
</script>
</body>
</html>
