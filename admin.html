<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans Bengali","Kalpurush",system-ui,sans-serif;background:#F1F7F3;color:#14201A;min-height:100vh}
.shell{display:flex;min-height:100vh}
aside{width:250px;flex-shrink:0;background:linear-gradient(180deg,#0B5D2E,#0F4D27);color:#E8F5EC;padding:18px 12px;display:flex;flex-direction:column}
.logo{text-align:center;color:#fff}
.logo img{width:96px;height:96px;border-radius:50%;background:#fff;object-fit:contain}
.nav{margin-top:18px}
.nav button{display:flex;gap:10px;align-items:center;width:100%;background:none;border:none;color:#E8F5EC;padding:10px 12px;border-radius:12px;font-size:14px;cursor:pointer;text-align:left;margin-bottom:4px}
.nav button.on{background:#1E8E3E;color:#fff;font-weight:700}
.badge{margin-left:auto;background:#E53935;color:#fff;border-radius:99px;padding:1px 8px;font-size:11px}
main{flex:1;padding:20px;min-width:0}
.head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;background:linear-gradient(90deg,#1E8E3E,#0B5D2E);color:#fff;border-radius:18px;padding:16px 20px;margin-bottom:16px}
.card{background:#fff;border-radius:18px;padding:16px;box-shadow:0 4px 16px rgba(20,60,30,.08);margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.stat{border-radius:18px;padding:14px;color:#fff;box-shadow:0 6px 16px rgba(0,0,0,.12)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.btn{background:#1E8E3E;color:#fff;border:none;border-radius:12px;padding:9px 14px;font-weight:700;cursor:pointer;font-size:14px;font-family:inherit}
.btn.red{background:#D32F2F}
.btn.g{background:#fff;color:#1E8E3E;border:1px solid #1E8E3E}
.btn.sm{padding:6px 10px;font-size:12px}
input,select,textarea{width:100%;padding:10px;border:1px solid #CFE5D6;border-radius:12px;font-size:14px;font-family:inherit;background:#fff;margin-bottom:6px}
label{display:block;font-size:13px;color:#44604E;margin:8px 0 4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 8px;border-bottom:1px solid #E6F0E9;text-align:left;vertical-align:middle}
th{background:#F3FAF5;color:#44604E}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700}
.p-wait{background:#FFF4D6;color:#8A5A00}.p-ok{background:#DDF5E4;color:#1E6B34}.p-no{background:#FDE4E4;color:#9B1C1C}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tabs button{border:1px solid #CFE5D6;background:#fff;border-radius:99px;padding:7px 14px;cursor:pointer;font-size:13px;font-family:inherit}
.tabs button.on{background:#1E8E3E;color:#fff;border-color:#1E8E3E}
.muted{color:#6B7A70;font-size:12px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.sheet{background:#fff;border-radius:18px;padding:18px;width:100%;max-width:440px;max-height:90vh;overflow:auto}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#0B5D2E,#1E8E3E);padding:16px}
.login .box{background:#fff;border-radius:22px;padding:26px;width:100%;max-width:380px}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#14201A;color:#fff;padding:10px 16px;border-radius:12px;z-index:60}
@media(max-width:900px){.shell{flex-direction:column}aside{width:100%}.grid2{grid-template-columns:1fr}}
</style>

<div id="app"></div>
<script>
firebase.initializeApp({
  apiKey:"AIzaSyAKTRy6I6wvKKlR96DfHPN7HXbxWcWFD2Q",
  authDomain:"berther-telecom-a81ec.firebaseapp.com",
  projectId:"berther-telecom-a81ec",
  storageBucket:"berther-telecom-a81ec.firebasestorage.app",
  messagingSenderId:"309372952524",
  appId:"1:309372952524:web:fbc780dd472d1a79f24769"
});
const AUTH=firebase.auth(), DBX=firebase.firestore();

/* ---------- basics ---------- */
const BN="০১২৩৪৫৬৭৮৯";
const bn=n=>Math.round(Number(n)||0).toLocaleString("en-US").replace(/\d/g,d=>BN[d]);
const taka=n=>"৳ "+bn(n);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function today(o){const d=new Date();d.setDate(d.getDate()+o);return d.toISOString().slice(0,10)}
const dateLabel=iso=>String(iso||"").split("-").reverse().join("/");
const nid=()=>"T"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const TXT={add:"অ্যাড মানি",withdraw:"ক্যাশ আউট",recharge:"রিচার্জ",drive:"ড্রাইভ",send:"ট্রান্সফার",bill:"বিল পেমেন্ট",sale:"বিক্রি",expense:"খরচ"};
const ST={pending:["পেন্ডিং","p-wait"],approved:["অনুমোদিত","p-ok"],done:["সম্পন্ন","p-ok"],rejected:["বাতিল","p-no"]};
const LANES=[{k:"add-bkash",l:"বিকাশ অ্যাড মানি",t:"add",m:"বিকাশ"},{k:"add-nagad",l:"নগদ অ্যাড মানি",t:"add",m:"নগদ"},{k:"out-bkash",l:"বিকাশ ক্যাশ আউট",t:"withdraw",m:"বিকাশ"},{k:"out-nagad",l:"নগদ ক্যাশ আউট",t:"withdraw",m:"নগদ"}];
const MKEY={"বিকাশ":"bkash","নগদ":"nagad","রকেট":"rocket","ব্যাংক":"bank"};
const isReq=x=>x.type==="add"||x.type==="withdraw"||x.type==="recharge"||x.type==="drive";
const methodOf=x=>x.method||(String(x.note||"").indexOf("নগদ")===0?"নগদ":"বিকাশ");

const S={user:null,err:"",loginEmail:"",loginPass:"",page:"dash",lane:"add-bkash",st:"pending",q:"",
  users:[],wallets:{},tx:[],hisab:[],settings:{},audit:[],busy:{},modal:null,md:{},subs:[]};

const userOf=uid=>S.users.find(u=>u.id===uid)||{};
const pending=()=>S.tx.filter(x=>isReq(x)&&x.status==="pending");
function log(a){S.audit.unshift({t:new Date().toLocaleTimeString("bn-BD"),who:S.user?S.user.email:"",act:a})}
function toast(m){const d=document.createElement("div");d.className="toast";d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
function go(p){S.page=p;S.q="";render()}
function closeM(){S.modal=null;render()}

/* ---------- live data (admin reads everything) ---------- */
function start(){
  const sub=(ref,cb)=>S.subs.push(ref.onSnapshot(cb,e=>console.warn(e)));
  sub(DBX.doc("settings/main"),s=>{S.settings=s.exists?s.data():{};render()});
  sub(DBX.collection("users"),q=>{S.users=q.docs.map(d=>({id:d.id,...d.data()}));render()});
  sub(DBX.collection("wallets"),q=>{S.wallets={};q.docs.forEach(d=>{S.wallets[d.id]=d.data().balance||0});render()});
  sub(DBX.collection("wallet_tx"),q=>{S.tx=q.docs.map(d=>({id:d.id,...d.data()}));render()});
  sub(DBX.collection("hisab"),q=>{S.hisab=q.docs.map(d=>({id:d.id,...d.data()}));render()});
}
function stop(){S.subs.forEach(u=>{try{u()}catch(e){}});S.subs=[];S.users=[];S.wallets={};S.tx=[];S.hisab=[];}

/* ---------- actions ---------- */
async function login(){
  S.err="";
  try{ await AUTH.signInWithEmailAndPassword(S.loginEmail.trim(),S.loginPass); S.loginPass=""; }
  catch(e){ S.err="ইমেইল বা পাসওয়ার্ড ভুল"; }
  render();
}
function openDecide(id,ok){S.modal={t:"decide",id,ok};S.md={note:""};render()}
function openUser(uid){S.modal={t:"user",uid};S.md={amt:"",note:"এডমিন সমন্বয়"};render()}

// Approve / reject in one transaction: a request can be finished only once.
async function decide(id,ok,note){
  if(S.busy[id])return; S.busy[id]=1;
  const ref=DBX.doc("wallet_tx/"+id);
  try{
    await DBX.runTransaction(async tr=>{
      const snap=await tr.get(ref);
      if(!snap.exists) throw new Error("missing");
      const t=snap.data();
      if(t.status!=="pending") throw new Error("done");
      const wref=DBX.doc("wallets/"+t.uid);
      if(ok){
        if(t.type==="add"||t.type==="withdraw"||t.type==="recharge"){
          const ws=await tr.get(wref);
          const cur=(ws.exists&&ws.data().balance)||0;
          if(t.type==="add") tr.set(wref,{balance:cur+t.amount});
          else { if(cur<t.amount) throw new Error("balance"); tr.set(wref,{balance:cur-t.amount}); }
        }
      } else if(t.type==="drive"){
        const ws=await tr.get(wref);
        const cur=(ws.exists&&ws.data().balance)||0;
        tr.set(wref,{balance:cur+t.amount});
      }
      tr.update(ref,{status:ok?"approved":"rejected",note:note||t.note||"",decidedAt:new Date().toISOString(),decidedBy:S.user.email});
    });
    log((ok?"অনুমোদন ":"বাতিল ")+id); toast(ok?"অনুমোদন হয়েছে":"বাতিল হয়েছে");
  }catch(e){
    alert(e.message==="done"?"এই রিকোয়েস্ট আগেই প্রক্রিয়া হয়েছে":e.message==="balance"?"ব্যালেন্স যথেষ্ট নয়":e.message==="missing"?"রিকোয়েস্ট পাওয়া যায়নি":"কাজটি সম্পন্ন হয়নি");
  }finally{ delete S.busy[id]; S.modal=null; render(); }
}

async function adjust(uid,kind){
  const a=parseFloat(S.md.amt);
  if(!a||a<=0) return alert("সঠিক পরিমাণ লিখুন");
  const cur=S.wallets[uid]||0;
  if(kind==="deduct"&&a>cur) return alert("ব্যালেন্সের বেশি কাটা যাবে না");
  try{
    await DBX.doc("wallets/"+uid).set({balance:kind==="add"?cur+a:cur-a});
    await DBX.doc("wallet_tx/"+nid()).set({type:kind==="add"?"add":"withdraw",amount:a,note:"এডমিন: "+(S.md.note||"সমন্বয়"),to:"",method:"",status:"done",date:today(0),uid});
    log((kind==="add"?"যোগ ":"কাটা ")+taka(a)+" · "+(userOf(uid).name||uid));
    toast("ব্যালেন্স আপডেট হয়েছে"); S.modal=null; render();
  }catch(e){ alert("সমন্বয় হয়নি") }
}

async function toggleBlock(uid){
  const u=userOf(uid);
  try{ await DBX.doc("users/"+uid).update({blocked:!u.blocked}); log((u.blocked?"আনব্লক ":"ব্লক ")+(u.name||uid)); }
  catch(e){ alert("কাজটি হয়নি") }
}

async function saveS(patch){
  try{ await DBX.doc("settings/main").update(patch); log("সেটিংস আপডেট"); toast("সেভ হয়েছে"); }
  catch(e){ alert("সেভ হয়নি") }
}
function saveLimits(){ saveS({limits:{daily:+(document.getElementById("lm-d").value||0),perTx:+(document.getElementById("lm-p").value||0)}}) }
function saveDaily(){ saveS({daily:{sale:+(document.getElementById("dy-s").value||0),exp:+(document.getElementById("dy-e").value||0),date:today(0)}}) }
function saveApp(){
  const v=document.getElementById("ap-v").value.trim(), u=document.getElementById("ap-u").value.trim();
  if(v&&!/^\d+(\.\d+)*$/.test(v)) return alert("সংস্করণ লিখুন, যেমন 1.1.0");
  if(u&&!/^https?:\/\//.test(u)) return alert("লিংক https:// দিয়ে শুরু হতে হবে");
  saveS({app:{version:v,url:u,note:document.getElementById("ap-n").value.trim(),force:!!(S.settings.app||{}).force}});
}
function toggleForce(){ const a=S.settings.app||{}; saveS({"app.force":!a.force}) }
function addSvc(){
  const name=document.getElementById("sv-n").value.trim(); if(!name) return alert("নাম লিখুন");
  saveS({services:[...(S.settings.services||[]),{id:nid(),cat:document.getElementById("sv-c").value,name,phone:document.getElementById("sv-p").value.trim(),area:document.getElementById("sv-a").value.trim()}]});
}
function rmSvc(id){ saveS({services:(S.settings.services||[]).filter(x=>x.id!==id)}) }
function addOffer(){
  const name=document.getElementById("of-n").value.trim(), price=parseFloat(document.getElementById("of-p").value);
  if(!name) return alert("নাম লিখুন"); if(!(price>=0)) return alert("সঠিক দাম লিখুন");
  saveS({offers:[...(S.settings.offers||[]),{id:nid(),kind:document.getElementById("of-k").value,op:document.getElementById("of-o").value.trim(),name,price,days:parseInt(document.getElementById("of-d").value)||0}]});
}
function rmOffer(id){ saveS({offers:(S.settings.offers||[]).filter(x=>x.id!==id)}) }
function addAd(){
  const img=document.getElementById("ad-i").value.trim();
  const video=document.getElementById("ad-v").value.trim();
  if(!img&&!video) return alert("ছবি বা ভিডিওর লিংক দিন");
  if(img&&!/^https?:\/\//.test(img)) return alert("ছবির লিংক https:// দিয়ে শুরু হতে হবে");
  if(video&&!/^https?:\/\//.test(video)) return alert("ভিডিওর লিংক https:// দিয়ে শুরু হতে হবে");
  saveS({ads:[...(S.settings.ads||[]),{id:nid(),text:document.getElementById("ad-t").value.trim(),link:document.getElementById("ad-l").value.trim(),img,video}]});
}
function qrFile(k,input){
  const f=input.files&&input.files[0]; if(!f) return;
  const url=URL.createObjectURL(f); const img=new Image();
  img.onload=()=>{
    const sc=Math.min(1,400/Math.max(img.width,img.height));
    const c=document.createElement("canvas");
    c.width=Math.max(1,Math.round(img.width*sc)); c.height=Math.max(1,Math.round(img.height*sc));
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url);
    saveS({["payment."+k+".qr"]:c.toDataURL("image/jpeg",0.85)});
  };
  img.onerror=()=>{ URL.revokeObjectURL(url); alert("ছবি পড়া যায়নি"); };
  img.src=url;
}
function rmAd(id){ saveS({ads:(S.settings.ads||[]).filter(x=>x.id!==id)}) }
function pubNotice(){
  const t=document.getElementById("nt").value.trim(); if(!t) return alert("নোটিশ লিখুন");
  saveS({notice:{text:t,at:new Date().toLocaleString("bn-BD")}});
}
function copyCsv(){ const t=document.getElementById("csv"); t.select(); try{ document.execCommand("copy"); toast("কপি হয়েছে") }catch(e){ alert("নিজে সিলেক্ট করে কপি করুন") } }

/* ---------- small view helpers ---------- */
const mini=(bg,l,v)=>`<div style="background:${bg};border-radius:14px;padding:12px;text-align:center"><div style="font-size:13px;font-weight:700">${l}</div><div style="font-size:24px;font-weight:800">${bn(v)}</div></div>`;
const qb=(i,l,p)=>`<button onclick="go('${p}')" style="background:#F3FAF5;border:1px solid #CFE5D6;border-radius:14px;padding:12px 6px;cursor:pointer;font-weight:700;color:#0B5D2E;font-family:inherit">${i}<br>${l}</button>`;
const stat=(bg,i,l,v)=>`<div class="stat" style="background:${bg}"><div style="font-size:13px;opacity:.9">${i} ${l}</div><div style="font-size:21px;font-weight:800;margin-top:4px">${v}</div></div>`;
function acts(x){
  return x.status==="pending"
    ?`<button class="btn sm" onclick="openDecide('${x.id}',true)">অনুমোদন</button> <button class="btn sm red" onclick="openDecide('${x.id}',false)">বাতিল</button>`
    :`<span class="muted">${esc(x.note||"—")}</span>`;
}
function txTable(list,withActs){
  if(!list.length) return '<div class="muted" style="padding:14px 0">কোনো তথ্য নেই</div>';
  return `<div style="overflow:auto"><table><thead><tr><th>ইউজার</th><th>ধরন</th><th>মাধ্যম</th><th>পরিমাণ</th><th>TrxID / নম্বর</th><th>তারিখ</th><th>অবস্থা</th>${withActs?"<th>কাজ</th>":""}</tr></thead><tbody>${list.map(x=>{
    const u=userOf(x.uid), s=ST[x.status]||ST.done;
    return `<tr><td><b>${esc(u.name||"—")}</b><div class="muted">${esc(u.phone||"")}</div></td><td>${TXT[x.type]||esc(x.type)}</td><td>${esc(methodOf(x))}</td><td><b>${taka(x.amount)}</b></td><td>${esc(x.trxId||x.to||"")}</td><td>${dateLabel(x.date)}</td><td><span class="pill ${s[1]}">${s[0]}</span></td>${withActs?`<td>${acts(x)}</td>`:""}</tr>`;
  }).join("")}</tbody></table></div>`;
}
function chart(){
  const days=[];
  for(let i=6;i>=0;i--){ const d=today(-i); days.push({d,v:S.hisab.filter(x=>x.type==="sale"&&x.date===d).reduce((a,b)=>a+b.amount,0)}); }
  const max=Math.max(...days.map(x=>x.v),1), W=520, H=180, p=26;
  const pts=days.map((x,i)=>[p+i*((W-2*p)/6), H-p-(x.v/max)*(H-2*p)]);
  const line=pts.map(q=>q[0].toFixed(1)+","+q[1].toFixed(1)).join(" ");
  const area=`${p},${H-p} ${line} ${W-p},${H-p}`;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;margin-top:8px"><polygon points="${area}" fill="rgba(30,142,62,.15)"/><polyline points="${line}" fill="none" stroke="#1E8E3E" stroke-width="3"/>${pts.map((q,i)=>`<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="4" fill="#1E8E3E"/><text x="${q[0].toFixed(1)}" y="${H-6}" font-size="11" text-anchor="middle" fill="#555">${days[i].d.slice(5)}</text>`).join("")}</svg>`;
}

/* ---------- pages ---------- */
function dash(){
  const t0=today(0);
  const sumW=Object.values(S.wallets).reduce((a,b)=>a+b,0);
  const sale=S.hisab.filter(x=>x.type==="sale"&&x.date===t0).reduce((a,b)=>a+b.amount,0);
  const exp=S.hisab.filter(x=>x.type==="expense"&&x.date===t0).reduce((a,b)=>a+b.amount,0);
  const cnt=(m,s)=>S.tx.filter(x=>x.type==="add"&&methodOf(x)===m&&x.status===s).length;
  const pend=pending().sort((a,b)=>a.id<b.id?1:-1).slice(0,6);
  const recent=S.tx.slice().sort((a,b)=>a.id<b.id?1:-1).slice(0,6);
  return `<div class="stats">
    ${stat("linear-gradient(135deg,#1E8E3E,#0B5D2E)","👥","মোট ইউজার",bn(S.users.length))}
    ${stat("linear-gradient(135deg,#2563EB,#1E40AF)","👛","ওয়ালেট ব্যালেন্স",taka(sumW))}
    ${stat("linear-gradient(135deg,#7C3AED,#5B21B6)","🛒","আজকের বিক্রি",taka(sale))}
    ${stat("linear-gradient(135deg,#F59E0B,#D97706)","💸","আজকের খরচ",taka(exp))}
    ${stat("linear-gradient(135deg,#0D9488,#115E59)","📈","আজকের লাভ",taka(sale-exp))}
  </div>
  <div class="grid2">
    <div class="card"><b>বিকাশ/নগদ অ্যাড মানি</b><div class="grid2" style="margin:10px 0 0">
      ${mini("#FCE7F3","বিকাশ পেন্ডিং",cnt("বিকাশ","pending"))}${mini("#DCFCE7","বিকাশ অনুমোদিত",cnt("বিকাশ","approved"))}

    const x=S.tx.find(v=>v.id===S.modal.id)||{}; const ok=S.modal.ok;
    return wrapModal(`<h3>${ok?"অনুমোদন":"বাতিল"}</h3>
      <div class="muted">${esc(userOf(x.uid).name||"")} · ${taka(x.amount)} · ${esc(x.trxId||x.to||"")}</div>

      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px"><button class="btn g" onclick="closeM()">ফিরে যান</button><button class="btn ${ok?'':'red'}" onclick="decide('${S.modal.id}',${ok},S.md.note)">নিশ্চিত</button></div>`);
  }
  if(S.modal.t==="user"){
    const uid=S.modal.uid, u=userOf(uid);

  let ok=false;
  try{ const d=await DBX.doc("admins/"+u.email).get(); ok=d.exists; }catch(e){ ok=false; }
  if(!ok){ S.err="এই অ্যাকাউন্টে এডমিন অনুমতি নেই"; await AUTH.signOut(); render(); return; }
  S.user=u; S.err=""; S.loginPass="";
  start(); render();
});
</script>
